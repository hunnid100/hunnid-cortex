services:
  # ---------------------------------------------------------
  # 1. OLLAMA (The Brain)
  # ---------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ai_ollama
    restart: always
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ${STACK_DATA_ROOT}/ollama:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - ai-network

  # ---------------------------------------------------------
  # 2. LITELLM (The Router)
  # ---------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ai_litellm
    restart: always
    volumes:
      - ${STACK_DATA_ROOT}/litellm/config.yaml:/app/config.yaml
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    ports:
      - "4000:4000"
    depends_on:
      - ollama
    networks:
      - ai-network

  # ---------------------------------------------------------
  # 3. OPEN WEBUI PIPELINES (The Interceptor)
  # ---------------------------------------------------------
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: ai_pipelines
    restart: always
    volumes:
      - ${STACK_DATA_ROOT}/pipelines:/app/pipelines
    ports:
      - "9099:9099"
    networks:
      - ai-network

  # ---------------------------------------------------------
  # 4. OPEN WEBUI (The Interface)
  # ---------------------------------------------------------
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ai_openwebui
    restart: always
    volumes:
      - ${STACK_DATA_ROOT}/openwebui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_BASE_URL=http://pipelines:9099
      - OPENAI_API_KEY=${OPENWEBUI_API_KEY}
    ports:
      - "8090:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pipelines
      - ollama
    networks:
      - ai-network

  # ---------------------------------------------------------
  # 5. POSTGRES (The Database)
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ai_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${STACK_DATA_ROOT}/postgres:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    ports:
      - "5433:5432"
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # 6. REDIS (The Cache)
  # ---------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: ai_redis
    restart: always
    volumes:
      - ${STACK_DATA_ROOT}/redis:/data
    ports:
      - "6380:6379"
    networks:
      - ai-network

  # ---------------------------------------------------------
  # 7. n8n (The Automation)
  # ---------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: ai_n8n
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${HOST_IP}
      - GENERIC_TIMEZONE=${TIMEZONE}
    ports:
      - "5678:5678"
    volumes:
      - ${STACK_DATA_ROOT}/n8n:/home/node/.n8n
      # Direct access to Nextcloud files via variable
      - ${NEXTCLOUD_DATA_PATH}:/mnt/nextcloud_data:ro
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-network

  # ---------------------------------------------------------
  # 8. MCP FILESYSTEM (Nextcloud Bridge)
  # ---------------------------------------------------------
  mcp-filesystem:
    build: ./mcp-filesystem
    container_name: ai_mcp_filesystem
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ${NEXTCLOUD_DATA_PATH}:/data:ro
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge
