services:
  # ---------------------------------------------------------
  # 1. OLLAMA (The Brain) - Runs the Local LLMs
  # ---------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ai_ollama
    restart: always
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - /mnt/ai_storage/ai-stack/ollama:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - ai-network

  # ---------------------------------------------------------
  # 2. LITELLM (The Router) - Proxies requests to Ollama
  # ---------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ai_litellm
    restart: always
    volumes:
      - /mnt/ai_storage/ai-stack/litellm/config.yaml:/app/config.yaml
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    ports:
      - "4000:4000"
    depends_on:
      - ollama
    networks:
      - ai-network

  # ---------------------------------------------------------
  # 3. OPEN WEBUI PIPELINES (The Interceptor) - NEW!
  # ---------------------------------------------------------
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: ai_pipelines
    restart: always
    volumes:
      - /mnt/ai_storage/ai-stack/pipelines:/app/pipelines
    ports:
      - "9099:9099"
    networks:
      - ai-network

  # ---------------------------------------------------------
  # 4. OPEN WEBUI (The Interface) - Chat & RAG
  # ---------------------------------------------------------
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ai_openwebui
    restart: always
    volumes:
      - /mnt/ai_storage/ai-stack/openwebui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_BASE_URL=http://pipelines:9099 # Connects to Pipelines
      - OPENAI_API_KEY=0p3n-w3bu1 # Dummy key required for Pipelines
    ports:
      - "8090:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pipelines
      - ollama
    networks:
      - ai-network

  # ---------------------------------------------------------
  # 5. POSTGRES (The Database) - For n8n
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ai_postgres
    restart: always
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n_password_secure
      - POSTGRES_DB=n8n
    volumes:
      - /mnt/ai_storage/ai-stack/postgres:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    ports:
      - "5433:5432"
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # 6. REDIS (The Cache)
  # ---------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: ai_redis
    restart: always
    volumes:
      - /mnt/ai_storage/ai-stack/redis:/data
    ports:
      - "6380:6379"
    networks:
      - ai-network

  # ---------------------------------------------------------
  # 7. n8n (The Automation) - Workflow Automation
  # ---------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: ai_n8n
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_password_secure
      - N8N_ENCRYPTION_KEY=super_secret_encryption_key_change_me
      - N8N_HOST=192.168.8.162
      - GENERIC_TIMEZONE=America/Chicago
    ports:
      - "5678:5678"
    volumes:
      - /mnt/ai_storage/ai-stack/n8n:/home/node/.n8n
      # MOUNT ADDED: Give n8n direct access to Nextcloud files for processing
      - /mnt/fastshare/containers/nextcloud/nextcloud/data/hunnid/files:/mnt/nextcloud_data:ro
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-network

  # ---------------------------------------------------------
  # 8. MCP FILESYSTEM (Nextcloud Bridge)
  # ---------------------------------------------------------
  mcp-filesystem:
    build: ./mcp-filesystem
    container_name: ai_mcp_filesystem
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - /mnt/fastshare/containers/nextcloud/nextcloud/data/hunnid/files:/data:ro
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge
